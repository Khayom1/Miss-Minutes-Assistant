<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Miss Minutes — 3D Character Preview</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script><style>:root{color-scheme:dark;background:#17100d;color:#f7e7d3;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 50% 38%,#633019 0,#28170f 42%,#120d0b 100%)}header,footer{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(15px,3vw,22px);margin:0;letter-spacing:.08em}small{color:#d6a57b}main{min-height:68vh;display:grid;place-items:center;padding:10px}model-viewer{width:min(100%,900px);height:min(78dvh,820px);background:transparent;--poster-color:transparent}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{border:1px solid #9d5a2f;background:#2b1a13;color:#ffe4c8;border-radius:99px;padding:9px 14px;font:inherit;font-size:13px}button:active{background:#713b20}</style></head><body><header><h1>MISS MINUTES <small>/ TVA CHARACTER PREVIEW</small></h1><small>GLB · RIGGED · ANIMATED</small></header><main><model-viewer id="model" src="assets/models/miss-minutes.glb" alt="Animated 3D Miss Minutes character" camera-controls auto-rotate auto-rotate-delay="1800" rotation-per-second="18deg" shadow-intensity="1.1" exposure="1.05" environment-image="neutral" interaction-prompt="none" camera-orbit="0deg 75deg 4.5m" min-camera-orbit="auto auto 2.5m" max-camera-orbit="auto auto 8m"></model-viewer></main><footer><div class="controls" id="clips"></div><small>Drag to orbit · Pinch to zoom</small></footer><script>const viewer=document.querySelector('#model'),clips=document.querySelector('#clips'),names=["Idle_Breathe","Blink","Wave_Greeting","Pointing","Talk_Loop","Laugh","Surprised","Angry_Expression","Sleep_Idle","Glitch_Recovery"];viewer.addEventListener('load',()=>{for(const name of names){const b=document.createElement('button');b.textContent=name.replaceAll('_',' ');b.onclick=()=>{viewer.pause();viewer.animationName=name;viewer.currentTime=0;viewer.play();};clips.appendChild(b);}viewer.animationName='Idle_Breathe';viewer.play();});</script></body></html>
