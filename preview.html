<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#160d09">
  <title>Miss Minutes — 3D Character Foundry</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root{color-scheme:dark;background:#160d09;color:#f7e7d3;font-family:Inter,system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 50% 38%,#713719 0,#28170f 45%,#100907 100%)}
    header,footer{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{font-size:clamp(15px,3vw,22px);margin:0;letter-spacing:.08em}
    small{color:#d6a57b}
    main{min-height:65vh;display:grid;place-items:center;padding:10px}
    model-viewer{width:min(100%,920px);height:min(74dvh,820px);background:transparent;--poster-color:transparent;--progress-bar-color:#f28a35}
    .controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:1000px}
    button{border:1px solid #9d5a2f;background:#2b1a13;color:#ffe4c8;border-radius:99px;padding:9px 12px;font:inherit;font-size:12px;cursor:pointer}
    button:active,button[aria-pressed=true]{background:#713b20;border-color:#f28a35}
    .status{min-height:1.2em;color:#e9b27f;font-size:12px;text-align:center;padding:4px 10px}
    .hint{font-size:11px;color:#bd9475}
  </style>
</head>
<body>
  <header><h1>MISS MINUTES <small>/ TVA CHARACTER FOUNDRY</small></h1><small>GLB · 120 NODES · 17 CLIPS</small></header>
  <main>
    <model-viewer id="model" src="assets/models/miss-minutes.glb"
      alt="Original fan-made animated 3D Miss Minutes character"
      camera-controls auto-rotate auto-rotate-delay="1800" rotation-per-second="14deg"
      shadow-intensity="1.2" exposure="1.12" environment-image="neutral" interaction-prompt="none"
      camera-orbit="0deg 75deg 4.5m" min-camera-orbit="auto auto 2.5m" max-camera-orbit="auto auto 8m">
    </model-viewer>
  </main>
  <footer>
    <div class="controls" id="clips" aria-label="Animation selector"></div>
    <div><div class="status" id="status">Loading character asset…</div><div class="hint">Drag to orbit · Pinch to zoom · Tap an animation</div></div>
  </footer>
  <script>
    const viewer=document.querySelector("#model"),controls=document.querySelector("#clips"),status=document.querySelector("#status");
    const clips=["Idle_Breathe","Blink","Wave_Greeting","Pointing","Talk_Loop","Laugh","Surprised","Angry_Expression","Sleep_Idle","Glitch_Recovery","Walk_Cycle","Run_Cycle","Look_Around","Peek_Around","Spin_In_Place","Nervous_Glance","Cheerful_Bounce"];
    const looping=new Set(["Idle_Breathe","Talk_Loop","Walk_Cycle","Run_Cycle","Look_Around"]);
    function selectClip(name,button){
      viewer.pause();viewer.animationName=name;viewer.loop=looping.has(name);viewer.currentTime=0;viewer.play();
      controls.querySelectorAll("button").forEach(item=>item.setAttribute("aria-pressed","false"));
      button?.setAttribute("aria-pressed","true");status.textContent="Animation / "+name.replaceAll("_"," ");
    }
    viewer.addEventListener("load",()=>{
      controls.replaceChildren();
      const available=viewer.availableAnimations||[];
      for(const name of clips){
        if(available.length&&!available.includes(name))continue;
        const button=document.createElement("button");
        button.type="button";button.textContent=name.replaceAll("_"," ");button.setAttribute("aria-pressed","false");
        button.addEventListener("click",()=>selectClip(name,button));controls.appendChild(button);
      }
      const first=controls.querySelector("button");
      if(first)selectClip("Idle_Breathe",first);
      status.textContent="Character loaded · "+controls.children.length+" animation clips";
    });
    viewer.addEventListener("error",()=>{status.textContent="Model load failed. Check the GLB asset path.";});
  </script>
</body>
</html>
