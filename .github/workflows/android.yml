name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "phase/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep only the newest commit's validation for each ref. Every job in the
  # selected run still executes; superseded commits are never reported as passed.
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Kotlin source formatting basics
        run: |
          test -f app/src/main/java/com/khayom1/missminutes/MainActivity.kt
          test ! -d app/src/main/assets/models

      - name: Generate Kotlin declaration reachability triage
        run: |
          python3 tools/audit-kotlin-reachability.py --out build/kotlin-reachability
          test -s build/kotlin-reachability/kotlin-reachability.json
          test -s build/kotlin-reachability/kotlin-reachability-summary.md

      - name: Build app-local bytecode reachability graph
        run: |
          mkdir -p build/bytecode-audit
          curl --fail --silent --show-error --location https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar --output build/bytecode-audit/asm.jar
          javac -cp build/bytecode-audit/asm.jar -d build/bytecode-audit tools/BytecodeReachability.java
          python3 tools/test-bytecode-reachability.py build/bytecode-audit build/bytecode-audit/asm.jar
          ./gradlew --no-daemon :app:assembleDebug
          java -cp build/bytecode-audit:build/bytecode-audit/asm.jar BytecodeReachability app/src/main/AndroidManifest.xml build/bytecode-audit/bytecode-reachability.json app/build/tmp/kotlin-classes/debug app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          test -s build/bytecode-audit/bytecode-reachability.json

      - name: Scan tracked working tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 dir --redact --no-banner /repo

      - name: Run JVM tests, debug and release builds, and lint
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug assembleRelease lintRelease


      - name: Record resolved Android runtime dependencies
        run: |
          mkdir -p app/build/release-evidence
          ./gradlew --no-daemon -p app dependencies --write-locks > app/build/release-evidence/resolved-dependencies.txt
          test -s app/gradle.lockfile
          grep -E '^(com[.]google[.]guava:guava|com[.]google[.]protobuf:protobuf-(java|kotlin)|io[.]netty:netty-(codec|codec-http|codec-http2|common|handler|handler-proxy)):' app/gradle.lockfile || true
          if grep -E '^(com[.]google[.]guava:guava:(32[.]0[.]1-jre|33[.]3[.]1-jre)|com[.]google[.]protobuf:protobuf-(java|kotlin):3[.]24[.]4|io[.]netty:netty-[^:]+:4[.]1[.](93|110)[.]Final)=' app/gradle.lockfile; then
            echo "::error::A previously identified vulnerable dependency version remains locked"
            exit 1
          fi

      - name: Preserve resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-gradle-locks
          path: app/gradle.lockfile
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Gradle dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already committed."
          else
            git commit -m "Lock resolved Android dependencies"
            git push origin HEAD:main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Reverify clean builds, JVM tests and lint with committed locks
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug assembleRelease lintRelease

      - name: Scan resolved dependencies for known vulnerabilities (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pinned emulator packages
        run: |
          sdkmanager --install "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools"

      - name: Run Android instrumentation tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Generate APK checksums
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk > app/build/release-evidence/SHA256SUMS.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-p8-release-candidates
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/release-evidence/
            app/gradle.lockfile
            build/kotlin-reachability/
            build/bytecode-audit/bytecode-reachability.json
          if-no-files-found: error
          retention-days: 14
