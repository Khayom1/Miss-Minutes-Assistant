name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Kotlin source formatting basics
        run: |
          test -f app/src/main/java/com/khayom1/missminutes/MainActivity.kt
          # Keep large local LLM payloads out of the APK; P3 may add a small offline wake-word asset.
          test ! -d app/src/main/assets/llm-models

      - name: Scan tracked working tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 dir --redact --no-banner /repo

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Supabase Edge Function unit tests
        run: |
          deno test supabase/functions/miss-minutes-ai/index_test.ts

      - name: Verify deployed gateway rejects unauthenticated requests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")

          def public_build_config(name):
              pattern = rf'buildConfigField\("String",\s*"{name}",\s*"\\\"([^"]+)\\\""'
              match = re.search(pattern, gradle)
              if not match:
                  raise SystemExit(f"Missing public BuildConfig field: {name}")
              return match.group(1)

          supabase_url = public_build_config("SUPABASE_URL").rstrip("/")
          publishable_key = public_build_config("SUPABASE_PUBLISHABLE_KEY")
          request = Request(
              f"{supabase_url}/functions/v1/miss-minutes-ai",
              data=json.dumps({
                  "messages": [{
                      "role": "user",
                      "content": "CI unauthenticated gateway smoke test"
                  }]
              }).encode("utf-8"),
              headers={
                  "apikey": publishable_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urlopen(request, timeout=20) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except HTTPError as response:
              status = response.code
              body = response.read().decode("utf-8", errors="replace")
          except URLError as error:
              raise SystemExit(f"Supabase gateway smoke test network error: {error.reason}")

          if status != 401:
              print(f"Expected HTTP 401 without a user JWT, received HTTP {status}.")
              print(body[:500])
              raise SystemExit(1)

          print("Unauthenticated request correctly rejected with HTTP 401.")
          PY

      - name: Run unit tests, build APK and lint
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug lintDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
