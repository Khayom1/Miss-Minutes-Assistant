name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "phase/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Update Android SDK command-line tools
        run: |
          sdkmanager --install "cmdline-tools;latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37|system-images;android-37|build-tools;37' || true

      - name: Install Android platform
        run: sdkmanager --channel=3 --install "platforms;android-35" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify Kotlin source formatting basics
        run: |
          test -f app/src/main/java/com/khayom1/missminutes/MainActivity.kt
          test ! -d app/src/main/assets/models

      - name: Verify Android 17 platform security policy
        run: bash scripts/verify-android-platform-policy.sh

      - name: Scan tracked working tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 dir --redact --no-banner /repo

      - name: Resolve Gradle lockfiles for dependency vulnerability scanning
        run: |
          gradle --no-daemon -p app --write-locks dependencies --configuration debugRuntimeClasspath
          gradle --no-daemon -p app --write-locks dependencies --configuration releaseRuntimeClasspath
          gradle --no-daemon -p app --write-locks dependencies --configuration debugUnitTestRuntimeClasspath
          gradle --no-daemon -p app --write-locks dependencies --configuration debugAndroidTestRuntimeClasspath
          test -s app/gradle.lockfile

      - name: Scan resolved Gradle dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            .

      - name: Run JVM tests, debug and release builds, and lint
        id: build_validation
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug lintDebug assembleRelease lintRelease


      - name: Record resolved Android runtime dependencies
        run: |
          mkdir -p app/build/release-evidence
          gradle --no-daemon -p app dependencies --configuration debugRuntimeClasspath > app/build/release-evidence/debug-runtime-dependencies.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pinned emulator packages
        run: |
          sdkmanager --channel=3 --install "platforms;android-35" "system-images;android-35;google_apis;x86_64" "platforms;android-37.0" "system-images;android-37.0;default;x86_64" "emulator" "platform-tools"

      - name: Run Android instrumentation tests (API 37.0)
        id: api37_instrumentation
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_SDK_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"
          AVD_OUTPUT="$(printf 'no\n' | avdmanager create avd --force -n android17-api37 -k "system-images;android-37.0;default;x86_64" -d "pixel_6" -p "$ANDROID_AVD_HOME/android17-api37.avd" 2>&1)" || {
            printf '%s\n' "$AVD_OUTPUT"
            avdmanager list avd
            exit 1
          }
          printf '%s\n' "$AVD_OUTPUT"
          if [ ! -s "$ANDROID_AVD_HOME/android17-api37.ini" ] || [ ! -s "$ANDROID_AVD_HOME/android17-api37.avd/config.ini" ]; then
            echo "API 37 AVD was not created in ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >&2
            find "$HOME/.android" -maxdepth 3 -type f -name '*.ini' -print || true
            avdmanager list avd
            exit 1
          fi
          # Use a current device profile with enough RAM and userdata for API 37
          # system services plus the debug and instrumentation APK splits.
          AVD_CONFIG="$ANDROID_AVD_HOME/android17-api37.avd/config.ini"
          sed -i '/^disk.dataPartition.size=/d; /^hw.ramSize=/d; /^vm.heapSize=/d; /^hw.cpu.ncore=/d' "$AVD_CONFIG"
          printf '\ndisk.dataPartition.size=4G\nhw.ramSize=4096\nvm.heapSize=512\nhw.cpu.ncore=4\n' >> "$AVD_CONFIG"
          grep -F 'disk.dataPartition.size=4G' "$AVD_CONFIG"
          grep -F 'hw.ramSize=4096' "$AVD_CONFIG"
          grep -F 'vm.heapSize=512' "$AVD_CONFIG"
          grep -F 'hw.cpu.ncore=4' "$AVD_CONFIG"
          emulator -list-avds | grep -Fx "android17-api37"
          EMULATOR_LOG="$RUNNER_TEMP/android17-api37-emulator.log"
          emulator -avd android17-api37 -memory 4096 -cores 4 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save -wipe-data > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 240 adb wait-for-device
          for attempt in $(seq 1 90); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOTED" = "1" ]; then break; fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "API 37 emulator did not finish Android boot." >&2
            adb logcat -b all -d | tail -200 || true
            tail -200 "$EMULATOR_LOG" || true
            exit 1
          fi
          # sys.boot_completed may precede PackageManager/ActivityManager readiness.
          SERVICES_READY=0
          STABLE_SERVICE_CHECKS=0
          for attempt in $(seq 1 72); do
            PACKAGE_LIST="$(adb shell cmd package list packages 2>/dev/null || true)"
            CURRENT_USER="$(adb shell cmd activity get-current-user 2>/dev/null | tr -d '\r' || true)"
            SYSTEM_SERVER="$(adb shell getprop init.svc.system_server 2>/dev/null | tr -d '\r' || true)"
            MOUNT_SERVICE="$(adb shell service check mount 2>&1 || true)"
            MOUNT_DUMP="$(adb shell dumpsys mount 2>/dev/null || true)"
            if printf '%s\n' "$PACKAGE_LIST" | grep '^package:' >/dev/null &&
               [ "$CURRENT_USER" = "0" ] && [ "$SYSTEM_SERVER" = "running" ] &&
               printf '%s\n' "$MOUNT_SERVICE" | grep -q 'found' &&
               printf '%s\n' "$MOUNT_DUMP" | grep -Eqi 'StorageManagerService|VolumeInfo|mVolumes'; then
              STABLE_SERVICE_CHECKS=$((STABLE_SERVICE_CHECKS + 1))
              if [ "$STABLE_SERVICE_CHECKS" -ge 12 ]; then
                SERVICES_READY=1
                break
              fi
            else
              STABLE_SERVICE_CHECKS=0
            fi
            sleep 5
          done
          if [ "$SERVICES_READY" != "1" ]; then
            echo "Android 17 boot completed but framework package/activity services are unavailable." >&2
            adb shell service list || true
            adb shell getprop | grep -E 'sys.boot_completed|init.svc.system_server|ro.build.version.sdk' || true
            adb logcat -b all -d | grep -Ei 'system_server|PackageManager|FATAL EXCEPTION|OutOfMemory|Watchdog' | tail -200 || adb logcat -b all -d | tail -200
            tail -200 "$EMULATOR_LOG" || true
            exit 1
          fi
          printf '%s\n' "$PACKAGE_LIST" | sed -n '1,5p'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          DATA_AVAILABLE_KB="$(adb shell df -k /data | awk 'NR==2 {print $4}' | tr -d '\r')"
          if [ -z "$DATA_AVAILABLE_KB" ] || [ "$DATA_AVAILABLE_KB" -lt 524288 ]; then
            echo "API 37 emulator has less than 512 MiB available in /data." >&2
            adb shell df -h /data
            exit 1
          fi
          adb shell df -h /data
          collect_api37_diagnostics() {
            adb shell getprop init.svc.system_server || true
            adb shell service list | grep -E 'package|activity|mount' || true
            adb shell service check mount || true
            adb shell dumpsys mount || true
            adb logcat -b all -d > "$RUNNER_TEMP/android17-api37-logcat.txt" 2>/dev/null || true
            grep -Ei 'system_server|PackageManager|FATAL EXCEPTION|Watchdog|lowmemorykiller|OutOfMemory|Killing .*system_server' "$RUNNER_TEMP/android17-api37-logcat.txt" | tail -300 || tail -300 "$RUNNER_TEMP/android17-api37-logcat.txt"
            tail -200 "$EMULATOR_LOG" || true
          }
          echo "API 37 framework service state before instrumentation:"
          if ! adb shell service check package || ! adb shell service check activity || ! adb shell service check mount; then
            echo "API 37 framework services disappeared before instrumentation." >&2
            collect_api37_diagnostics
            exit 1
          fi
          INSTALL_PROBE="$(adb shell cmd package install-create -r -t -S 1024 2>&1)" || {
            printf '%s\n' "$INSTALL_PROBE"
            echo "API 37 PackageInstaller preflight failed before the test APK was installed." >&2
            collect_api37_diagnostics
            exit 1
          }
          printf '%s\n' "$INSTALL_PROBE"
          INSTALL_SESSION="$(printf '%s\n' "$INSTALL_PROBE" | sed -n 's/.*session \[\([0-9][0-9]*\)\].*/\1/p')"
          if [ -z "$INSTALL_SESSION" ]; then
            echo "API 37 PackageInstaller did not return a valid session id." >&2
            collect_api37_diagnostics
            exit 1
          fi
          adb shell cmd package install-abandon "$INSTALL_SESSION"
          if ! gradle --no-daemon connectedDebugAndroidTest; then
            echo "API 37 instrumentation failed; collecting framework and emulator diagnostics." >&2
            collect_api37_diagnostics
            exit 1
          fi
          adb logcat -b all -d > "$RUNNER_TEMP/android17-api37-logcat.txt" 2>/dev/null || true
          if ! adb shell service check package || ! adb shell service check activity; then
            echo "API 37 framework services disappeared after instrumentation." >&2
            collect_api37_diagnostics
            exit 1
          fi

      - name: Upload Android 17 emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android17-api37-diagnostics
          path: |
            ${{ runner.temp }}/android17-api37-emulator.log
            ${{ runner.temp }}/android17-api37-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android instrumentation tests (API 35 compatibility)
        if: ${{ always() && steps.build_validation.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Verify APK package, version and signature metadata
        if: ${{ always() && steps.build_validation.outcome == 'success' }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          unzip -tq "$DEBUG_APK"
          unzip -tq "$RELEASE_APK"
          DEBUG_BADGING="$("$AAPT" dump badging "$DEBUG_APK")"
          RELEASE_BADGING="$("$AAPT" dump badging "$RELEASE_APK")"
          printf '%s\n' "$DEBUG_BADGING" > app/build/release-evidence/debug-badging.txt
          printf '%s\n' "$RELEASE_BADGING" > app/build/release-evidence/release-badging.txt
          for BADGING in "$DEBUG_BADGING" "$RELEASE_BADGING"; do
            printf '%s\n' "$BADGING" | grep -F "package: name='com.khayom1.missminutes'"
            printf '%s\n' "$BADGING" | grep -F "sdkVersion:'26'"
            printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'37'"
          done
          DEBUG_VERSION="$(printf '%s\n' "$DEBUG_BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*versionName='\\([^']*\\)'.*/\\1 \\2/p")"
          RELEASE_VERSION="$(printf '%s\n' "$RELEASE_BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*versionName='\\([^']*\\)'.*/\\1 \\2/p")"
          test -n "$DEBUG_VERSION"
          test "$DEBUG_VERSION" = "$RELEASE_VERSION"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" > app/build/release-evidence/debug-signature.txt 2>&1
          if "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" > app/build/release-evidence/release-signature.txt 2>&1; then
            echo "Release APK is signed without an authorized owner-controlled release key." >&2
            exit 1
          fi
          grep -Eqi "DOES NOT VERIFY|No signatures|not signed" app/build/release-evidence/release-signature.txt
          {
            echo "applicationId=com.khayom1.missminutes"
            echo "version=$DEBUG_VERSION"
            echo "minSdk=26"
            echo "targetSdk=37"
            echo "debugSignature=verified; see debug-signature.txt"
            echo "releaseSignature=unsigned; owner-controlled release signing is required"
          } > app/build/release-evidence/apk-metadata.txt

      - name: Generate APK checksums
        if: ${{ always() && steps.build_validation.outcome == 'success' }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk > app/build/release-evidence/SHA256SUMS.txt

      - name: Upload release evidence
        if: ${{ always() && steps.build_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-p8-release-candidates
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/release-evidence/
          if-no-files-found: error
          retention-days: 14
