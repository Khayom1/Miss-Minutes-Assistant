name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Kotlin source formatting basics
        run: |
          test -f app/src/main/java/com/khayom1/missminutes/MainActivity.kt
          test ! -d app/src/main/assets/models

      - name: Scan tracked working tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 dir --redact --no-banner /repo

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Supabase AI gateway unit tests
        run: deno test supabase/functions/miss-minutes-ai/index_test.ts

      - name: Verify deployed gateway rejects unauthenticated requests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          for name in ("SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY"):
              pattern = rf'buildConfigField\("String",\s*"{name}",\s*"\\\"([^"]+)\\\""' 
              match = re.search(pattern, gradle)
              if not match:
                  raise SystemExit(f"Missing public BuildConfig field: {name}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"{name}={match.group(1)}\n")
          PY
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 20 \
            --request POST "$SUPABASE_URL/functions/v1/miss-minutes-ai" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","content":"CI unauthenticated gateway smoke test"}]}')"
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 without a user JWT, received HTTP $status."
            cat "$response_file"
            exit 1
          fi
          echo "Unauthenticated request correctly rejected with HTTP 401."

      - name: Run unit tests, build APK and lint
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug lintDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miss-minutes-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
